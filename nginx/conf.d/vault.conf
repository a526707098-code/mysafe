upstream vault_app { server private-vault-app:3000; keepalive 16; }
upstream vault_api { server private-vault-api:4000; keepalive 16; }

server {
  listen 8080;
  server_name _;

  client_max_body_size 25m;   # 20 MB uploads + multipart overhead
  include /etc/nginx/conf.d/security-headers.inc;
  # Enable once TLS terminates here or in front (Tailscale serve / private proxy):
  # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection "";
  proxy_hide_header X-Powered-By;
  # The app sets these too; nginx is the single source at the edge (no duplicates).
  proxy_hide_header X-Content-Type-Options;
  proxy_hide_header X-Frame-Options;
  proxy_hide_header Referrer-Policy;
  proxy_hide_header Cross-Origin-Opener-Policy;
  proxy_hide_header Cross-Origin-Resource-Policy;
  proxy_hide_header Permissions-Policy;

  # Internal-only endpoints are never reachable from outside the Docker network.
  location = /api/health { return 404; }
  location = /nginx-health { access_log off; return 200 "ok\n"; }

  location ~ ^/api/auth/ {
    limit_req zone=auth burst=5 nodelay;
    proxy_pass http://vault_api;
  }

  location /api/ {
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://vault_api;
  }

  location /_next/static/ {
    proxy_pass http://vault_app;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/conf.d/security-headers.inc;
  }

  location / {
    proxy_pass http://vault_app;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
